[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yaaml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "chromadb>=0.5",
    "watchdog>=4.0",
    "typer>=0.12",
    "rich>=13",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[project.scripts]
yaaml = "yaaml.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/yaaml"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
